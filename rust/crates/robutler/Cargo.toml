[package]
name = "robutler"
description = "Robutler platform defaults for webagents device agents, and the robutler-device command line tool"
readme = "README.md"
keywords = ["agents", "embedded", "robutler", "registers", "llm"]
categories = ["embedded", "command-line-utilities", "hardware-support"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["src/**", "README.md", "LICENSE"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
webagents = { version = "0.2.0", path = "../webagents" }

[[bin]]
name = "robutler-device"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
qrcode = { version = "0.14", default-features = false }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "signal", "macros", "time", "sync"] }
webagents = { version = "0.2.0", path = "../webagents", features = ["linux"] }
