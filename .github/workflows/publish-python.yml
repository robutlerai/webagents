name: "Publish Python SDK to PyPI"

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.3.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

defaults:
  run:
    working-directory: python

jobs:
  # A tag names the version in pyproject.toml, or nothing is published: a tag
  # the file disagrees with would publish the file's version under the tag's
  # name.
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: The tag names the version in pyproject.toml
      run: |
        tag="${GITHUB_REF_NAME#python-v}"
        declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
        if [ "$tag" != "$declared" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match version $declared in python/pyproject.toml"
          exit 1
        fi
        echo "tag and pyproject.toml agree: $declared"

  # The whole of CI on the commit being released (tests on every supported
  # Python, lint, the bare-install smoke, the package build). This workflow
  # used to build and publish straight from the tag, so a commit CI had
  # failed could be released.
  ci:
    # Read-only: CI needs to check out and run, nothing more; this workflow's
    # write and id-token permissions are for the publish job.
    permissions:
      contents: read
    uses: ./.github/workflows/ci-python.yml

  publish:
    needs: [tag, ci]
    # `tag` is skipped for a manual dispatch; CI is required either way.
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Update version (manual dispatch)
      if: github.event_name == 'workflow_dispatch'
      # Anchored to line start: the unanchored form also rewrote
      # `[tool.ruff] target-version` and `[tool.mypy] python_version`.
      run: |
        sed -i 's/^version = ".*"/version = "${{ github.event.inputs.version }}"/' pyproject.toml
        grep -c '^version = "${{ github.event.inputs.version }}"' pyproject.toml

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*

    - name: Create GitHub Release
      if: github.event_name == 'push'
      run: |
        gh release create ${{ github.ref_name }} \
          --title "Python SDK ${{ github.ref_name }}" \
          --notes "Python SDK release ${{ github.ref_name }}" \
          --latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The `robutler` package on PyPI (packages/robutler-py): the same version as webagents, depending on exactly that
  # version, with no code and no command of its own. It is uploaded only after the webagents this run has just
  # published is installed from PyPI into an empty environment and its `robutler` answers with the released version,
  # on its own and with the built thin package installed beside it.
  robutler:
    needs: publish
    # `publish` runs after a job a manual dispatch skips, so the default
    # "every job before me succeeded" would skip this one too.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      # Read from the environment, never interpolated into a script.
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: The robutler package names the released version
      run: |
        version="${DISPATCH_VERSION:-${GITHUB_REF_NAME#python-v}}"
        echo "VERSION=$version" >> "$GITHUB_ENV"
        # A manual dispatch names a version the files do not hold yet, as the publish job's own step does.
        if [ -n "$DISPATCH_VERSION" ]; then
          node scripts/thin-packages.mjs --only pypi --write --pypi "$version"
        fi
        node scripts/thin-packages.mjs --only pypi --pypi "$version"

    - name: The published webagents runs as robutler
      run: |
        python -m venv "$RUNNER_TEMP/clean"
        # PyPI can take a moment to serve a version it has just accepted.
        for attempt in $(seq 1 30); do
          if "$RUNNER_TEMP/clean/bin/pip" install --no-cache-dir "webagents==$VERSION"; then break; fi
          sleep 10
        done
        test "$("$RUNNER_TEMP/clean/bin/robutler" --version)" = "$VERSION"

    - name: Build the robutler package
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        python -m build packages/robutler-py
        twine check packages/robutler-py/dist/*

    - name: The built package installs beside it and changes nothing
      run: |
        "$RUNNER_TEMP/clean/bin/pip" install --no-cache-dir packages/robutler-py/dist/*.whl
        test "$("$RUNNER_TEMP/clean/bin/robutler" --version)" = "$VERSION"

    - name: Upload robutler to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_ROBUTLER_API_TOKEN }}
      run: twine upload packages/robutler-py/dist/*
