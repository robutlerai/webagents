name: "Publish Python SDK to PyPI"

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.3.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

defaults:
  run:
    working-directory: python

jobs:
  # A tag names the version in pyproject.toml, or nothing is published: a tag
  # the file disagrees with would publish the file's version under the tag's
  # name.
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: The tag names the version in pyproject.toml
      run: |
        tag="${GITHUB_REF_NAME#python-v}"
        declared=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
        if [ "$tag" != "$declared" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match version $declared in python/pyproject.toml"
          exit 1
        fi
        echo "tag and pyproject.toml agree: $declared"

  # The whole of CI on the commit being released (tests on every supported
  # Python, lint, the bare-install smoke, the package build). This workflow
  # used to build and publish straight from the tag, so a commit CI had
  # failed could be released.
  ci:
    # Read-only: CI needs to check out and run, nothing more; this workflow's
    # write and id-token permissions are for the publish job.
    permissions:
      contents: read
    uses: ./.github/workflows/ci-python.yml

  publish:
    needs: [tag, ci]
    # `tag` is skipped for a manual dispatch; CI is required either way.
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Update version (manual dispatch)
      if: github.event_name == 'workflow_dispatch'
      # Anchored to line start: the unanchored form also rewrote
      # `[tool.ruff] target-version` and `[tool.mypy] python_version`.
      run: |
        sed -i 's/^version = ".*"/version = "${{ github.event.inputs.version }}"/' pyproject.toml
        grep -c '^version = "${{ github.event.inputs.version }}"' pyproject.toml

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*

    - name: Create GitHub Release
      if: github.event_name == 'push'
      run: |
        gh release create ${{ github.ref_name }} \
          --title "Python SDK ${{ github.ref_name }}" \
          --notes "Python SDK release ${{ github.ref_name }}" \
          --latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
