name: "CI: TypeScript SDK"

on:
  push:
    branches: [main, develop]
    paths: ['typescript/**', '.github/workflows/ci-typescript.yml']
  pull_request:
    branches: [main, develop]
    paths: ['typescript/**', '.github/workflows/ci-typescript.yml']
  # Run by publish-typescript.yml on the tagged commit before anything is
  # published: a release goes out only from a commit this whole file passes on.
  workflow_call:

defaults:
  run:
    working-directory: typescript

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both supported LTS lines. The portal runs 24; the published SDK has
        # no native deps and no technical need for it, so we keep 22 working
        # for third-party consumers until it reaches EOL on 2027-04-30. This
        # matrix must stay in sync with the `engines` floor in package.json.
        node-version: ['22', '24']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm run lint

    - name: Type check
      run: pnpm run typecheck

    - name: Run tests
      run: pnpm run test:run

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install and build
      run: |
        pnpm install --frozen-lockfile
        pnpm run build

    - name: Check package
      # `pnpm pack --dry-run` is not an option in pnpm 9 (it failed with
      # "Unknown option: 'dry-run'"): pack for real into a scratch folder and
      # list what the tarball holds.
      run: |
        pnpm pack --pack-destination "$RUNNER_TEMP"
        tar tzf "$RUNNER_TEMP"/webagents-*.tgz

  # The scaffold has to RUN, from the packed CLI. `webagents init` writes one
  # AGENT.md and nothing to install (the Python CLI's project), so the check is
  # that the file is there, that no package.json is, and that the CLI reads the
  # new agent: with no model it answers with the way to get one and exit 1,
  # never a stack trace.
  scaffold:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Build and pack
      run: |
        pnpm install --frozen-lockfile
        pnpm run build
        pnpm pack --pack-destination /tmp

    - name: Install the packed CLI globally, from the tarball
      working-directory: /tmp
      run: npm install -g /tmp/webagents-*.tgz

    - name: Runtime assets ship in the tarball
      # `src/agents/ROBUTLER.md` is READ at runtime and `tsc` emits only .js and
      # .d.ts, so it was absent from every published package. The interactive
      # REPL then ran with NO system prompt, and the only symptom was a warning
      # on stderr, which is why it survived so long.
      #
      # Asserted against the TARBALL rather than an installed copy: that is the
      # artifact users get, and probing it through a bare specifier does not
      # work anyway because the package's `exports` map does not expose
      # `./dist/agents/index.js` (checked, not assumed).
      run: |
        set -e
        tarball=$(ls /tmp/webagents-*.tgz | head -1)
        for asset in package/dist/agents/ROBUTLER.md; do
          if ! tar tzf "$tarball" | grep -qx "$asset"; then
            echo "MISSING from the published tarball: $asset"
            echo "Add it to RUNTIME_ASSETS in scripts/copy-assets.mjs."
            exit 1
          fi
          echo "ships: $asset"
        done

    - name: Scaffold a project and run it
      working-directory: /tmp
      run: |
        set -e
        rm -rf /tmp/scaffold-check && mkdir -p /tmp/scaffold-check
        cd /tmp/scaffold-check
        webagents --version
        webagents init generated
        cd generated
        cat AGENT.md
        grep -qx 'name: generated' AGENT.md
        test ! -e package.json
        if webagents -p hello > answer.txt 2>&1; then
          cat answer.txt
          echo "expected the no-model answer and exit 1"
          exit 1
        fi
        cat answer.txt
        grep -q 'No model for this agent' answer.txt
        echo "scaffold runs"
