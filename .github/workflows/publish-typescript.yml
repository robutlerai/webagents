name: "Publish TypeScript SDK to npm"

on:
  push:
    tags:
      - 'typescript-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.3.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

defaults:
  run:
    working-directory: typescript

jobs:
  # A tag names the version in package.json, or nothing is published: a tag
  # the file disagrees with would publish the file's version under the tag's
  # name.
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: The tag names the version in package.json
      run: |
        tag="${GITHUB_REF_NAME#typescript-v}"
        declared=$(node -p "require('./package.json').version")
        if [ "$tag" != "$declared" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match version $declared in typescript/package.json"
          exit 1
        fi
        echo "tag and package.json agree: $declared"

  # The whole of CI on the commit being released (tests, lint, type check, the
  # package and scaffold checks). This workflow used to build and publish
  # straight from the tag, so a commit CI had failed could be released.
  ci:
    # Read-only: CI needs to check out and run, nothing more; this workflow's
    # write and id-token permissions are for the publish job.
    permissions:
      contents: read
    uses: ./.github/workflows/ci-typescript.yml

  publish:
    needs: [tag, ci]
    # `tag` is skipped for a manual dispatch; CI is required either way.
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Upgrade npm for OIDC support
      run: npm install -g npm@latest

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Update version (manual dispatch)
      if: github.event_name == 'workflow_dispatch'
      run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

    - name: Build
      run: pnpm run build

    - name: Publish to npm
      run: npm publish --provenance --access public --tag latest

    - name: Create GitHub Release
      if: github.event_name == 'push'
      run: |
        gh release create ${{ github.ref_name }} \
          --title "TypeScript SDK ${{ github.ref_name }}" \
          --notes "TypeScript SDK release ${{ github.ref_name }}" \
          --latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
