name: "Publish TypeScript SDK to npm"

on:
  push:
    tags:
      - 'typescript-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.3.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

defaults:
  run:
    working-directory: typescript

jobs:
  # A tag names the version in package.json, or nothing is published: a tag
  # the file disagrees with would publish the file's version under the tag's
  # name.
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: The tag names the version in package.json
      run: |
        tag="${GITHUB_REF_NAME#typescript-v}"
        declared=$(node -p "require('./package.json').version")
        if [ "$tag" != "$declared" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match version $declared in typescript/package.json"
          exit 1
        fi
        echo "tag and package.json agree: $declared"

  # The whole of CI on the commit being released (tests, lint, type check, the
  # package and scaffold checks). This workflow used to build and publish
  # straight from the tag, so a commit CI had failed could be released.
  ci:
    # Read-only: CI needs to check out and run, nothing more; this workflow's
    # write and id-token permissions are for the publish job.
    permissions:
      contents: read
    uses: ./.github/workflows/ci-typescript.yml

  publish:
    needs: [tag, ci]
    # `tag` is skipped for a manual dispatch; CI is required either way.
    if: ${{ !cancelled() && needs.ci.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Upgrade npm for OIDC support
      # A pinned major, not `npm@latest`: the 0.3.6 release picked up npm 12
      # the day it was current, mid-release, and its first publish rewrote
      # package.json with warnings nobody had seen before. Trusted publishing
      # (OIDC) needs npm 11.5.1 or later; move this pin on purpose.
      run: npm install -g npm@12

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Update version (manual dispatch)
      if: github.event_name == 'workflow_dispatch'
      run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

    - name: Build
      run: pnpm run build

    - name: Publish to npm
      run: npm publish --provenance --access public --tag latest

    - name: Create GitHub Release
      if: github.event_name == 'push'
      run: |
        gh release create ${{ github.ref_name }} \
          --title "TypeScript SDK ${{ github.ref_name }}" \
          --notes "TypeScript SDK release ${{ github.ref_name }}" \
          --latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Homebrew follows npm: `brew install robutlerai/tap/webagents`, and
  # `robutlerai/tap/robutler`, a second formula for the same package. The tap
  # repository (robutlerai/homebrew-tap) holds nothing of its own;
  # scripts/homebrew-tap.sh copies integrations/homebrew/tap/ into it with the
  # formulae stamped for the version just published. Both are INSTALLED and
  # tested on this runner before anything is pushed, so a formula that does
  # not install never reaches the tap, and the tap never names a version npm
  # does not serve.
  #
  # The push uses a deploy key that can write to that one repository and
  # nothing else (integrations/homebrew/README.md says how it is made). A
  # missing key FAILS the job rather than skipping it: npm is already
  # published by now, so nothing is lost, and a green run with a tap left one
  # version behind is the failure nobody would notice.
  homebrew:
    needs: publish
    # `publish` runs after a job a manual dispatch skips, so the default
    # "every job before me succeeded" would skip this one too.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    env:
      HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
      # Read from the environment, never interpolated into a script.
      DISPATCH_VERSION: ${{ github.event.inputs.version }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
    - name: The tap's deploy key is configured
      run: |
        if [ "$HAS_TAP_KEY" != "true" ]; then
          echo "::error title=Homebrew tap not updated::The HOMEBREW_TAP_DEPLOY_KEY secret is not set. integrations/homebrew/README.md says how to make it; then run scripts/homebrew-tap.sh by hand for this version, or re-run this job."
          exit 1
        fi

    - uses: actions/checkout@v4

    - name: Check out the tap
      uses: actions/checkout@v4
      with:
        repository: robutlerai/homebrew-tap
        ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        path: homebrew-tap

    - name: Write the tap for the published version
      run: |
        version="${DISPATCH_VERSION:-${GITHUB_REF_NAME#typescript-v}}"
        echo "VERSION=$version" >> "$GITHUB_ENV"
        ./scripts/homebrew-tap.sh homebrew-tap "$version"
        git -C homebrew-tap status --short

    - name: Install each formula from the tap, as a user would
      # By its full name and with no `brew trust` beforehand, which is what
      # the documented install line does on a user's machine: Homebrew trusts
      # a tap's formula only when it is installed by that name. One after the
      # other, because both link the same two commands.
      run: |
        taps="$(brew --repository)/Library/Taps/robutlerai"
        mkdir -p "$taps"
        cp -RP "$GITHUB_WORKSPACE/homebrew-tap" "$taps/homebrew-tap"
        brew style robutlerai/tap
        for formula in webagents robutler; do
          brew install "robutlerai/tap/$formula"
          brew test "robutlerai/tap/$formula"
          test "$(webagents --version)" = "$VERSION"
          robutler --help
          brew uninstall "$formula"
        done

    - name: Push the tap
      working-directory: homebrew-tap
      run: |
        if [ -z "$(git status --porcelain)" ]; then
          echo "the tap already holds webagents $VERSION"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "webagents $VERSION"
        git push origin HEAD
