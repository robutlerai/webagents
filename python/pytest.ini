; Pytest configuration for the webagents Python SDK.
;
; THIS FILE WINS over `[tool.pytest.ini_options]` in pyproject.toml: pytest's
; config discovery stops at the first `pytest.ini` it finds, so whatever is
; here is the whole configuration. Two things follow from that, both of which
; this file got wrong before and which cost a full test run to notice:
;
;   * the section header must be `[pytest]`. `[tool:pytest]` is the setup.cfg
;     spelling; in a pytest.ini it parses to nothing, so the file shadowed
;     pyproject.toml while contributing no settings of its own — which is why
;     `asyncio_mode` was not in force and every `async def` test errored with
;     "async def functions are not natively supported".
;   * only options whose plugins are actually installed may appear here.
;     `--cov*` (pytest-cov) and `timeout` (pytest-timeout) are not declared
;     dependencies, and `--co` turned every local run into collect-only.
;
; Keep this table and the one in pyproject.toml in agreement.

[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

; Async support: `auto` means a bare `async def test_...` runs without a
; per-test @pytest.mark.asyncio marker.
asyncio_mode = auto

markers =
    slow: marks tests as slow (deselect with -m 'not slow')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    mcp: marks tests as MCP-related
    performance: marks tests as performance tests
    auth: marks tests as authentication tests
    skill: marks tests as skill tests
    agent: marks tests as agent tests
    server: marks tests as server tests
    docs: marks tests that validate documentation code snippets

addopts =
    --strict-markers
    --tb=short
    -ra

minversion = 7.0

filterwarnings =
    ignore::UserWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore:Support for class-based.*:DeprecationWarning:pydantic.*
    ignore:The event_loop fixture.*:DeprecationWarning:pytest_asyncio.*
    ignore:coroutine.*was never awaited:RuntimeWarning

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
