[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webagents"
version = "0.3.9"
description = "Foundation framework for the Web of Agents - build, serve and monetize AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "robutler.ai"}
]
keywords = ["ai", "agents", "llm", "uamp", "webagents", "skills", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # UPPER BOUNDS ARE DELIBERATE (2026-09-23). A fresh `pip install` with no
    # ceilings resolved fastmcp 4.x / mcp 2.x and FastAPI 0.141 / Starlette 1.x,
    # two majors past anything tested. Dev venvs, created earlier, kept the old
    # versions and hid it: every existing checkout passed, while a new user got
    # an MCP skill that silently disabled itself (mcp 2.x renamed
    # `streamablehttp_client`), agent `@http` handlers that failed to register
    # (Starlette 1.x rejects `path:path`), and route-walking code that crashed on
    # FastAPI's `_IncludedRouter`. Found by the clean-room install check.
    # Raise these only after the suite passes on the new versions from a fresh
    # venv; a conflict at install time is loud, and the old failure was silent.
    "fastmcp>=2.3.0,<4",
    "mcp>=1.0.0,<2",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0,<0.136",
    "starlette<1",
    "uvicorn>=0.23.0",
    "tiktoken>=0.5.0",
    "colorama>=0.4.6",
    # CLI. Held below two releases that break the commander-style help and
    # errors in `webagents/cli/help_format.py` (2026-09-25, found by a fresh
    # CI install): typer 0.26 builds on its own private copy of click
    # (`typer._click`), so its groups are no longer `click.Group` and help lost
    # its command list while usage errors printed nothing; click 8.5 drops the
    # help text of a command's argument, so `webagents serve -h` lost its
    # Arguments section. Lift these with the formatter ported and
    # tests/cli/test_help_format.py and test_cli_parity.py passing on them.
    "typer>=0.12.0,<0.26",
    "click>=8.2.1,<8.5",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    # Daemon
    "watchdog>=4.0.0",
    "apscheduler>=3.10.0",
    "croniter>=2.0.0",
    "websockets>=12.0",
    # LLM providers
    "openai>=1.0.0",
    # Required by the top-level import chain / documented entry points.
    # These were undeclared (F-040): a bare `pip install webagents` produced
    # a package whose documented imports raised ModuleNotFoundError.
    "jinja2>=3.1.0",          # agents/widgets/renderer.py
    "aiohttp>=3.9.0",         # robutler platform skills and their API client (agents/skills/robutler/api)
    "PyYAML>=6.0",            # cli/loader/agent_md.py
    "PyJWT>=2.8.0",           # crypto/jwks.py, payments_x402
    "cryptography>=42.0.0",   # crypto/jwks.py key handling
    # `asyncio.timeout` is Python 3.11+; this is its backport for 3.10
    # (webagents/utils/async_timeout.py).
    "async-timeout>=4.0.3; python_version < '3.11'",
    # NODE FOR THE SANDBOX ENGINE (the sandbox-engine lane, 2026-09-27). The
    # sandbox is on by default and fails closed, and its engine, srt, is a
    # Node program that ships inside this package
    # (webagents/sandbox/sandbox_engine/). `node` from PATH is used when it is
    # 20.11 or later; this is the Node for everyone else, so `pip install
    # webagents` alone confines commands on a machine with no Node at all.
    # A HARD dependency, not an extra: pip installs no extra by default, and
    # an extra would leave exactly that user with every command refused. It
    # costs a ~56 MB (macOS) to ~61 MB (Linux) wheel. nodejs-wheel-binaries is
    # Jinzhe Zeng's (github.com/njzjz/nodejs-wheel, MIT; basedpyright depends
    # on it the same way). The markers are the platforms srt supports that
    # have a wheel, so pip never falls back to building Node from its sdist.
    # Capped below Node 25, the line this was tested on being 24 LTS.
    "nodejs-wheel-binaries>=22.12,<25; (sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')) or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
]

[project.optional-dependencies]
llm = [
    "google-genai>=1.0.0",
    "anthropic>=0.3.0",
]
embeddings = [
    "sentence-transformers>=2.2.0",
    "chromadb>=1.4.0",
]
scraping = [
    "trafilatura>=1.12.0",
]
tui = [
    "textual>=1.0.0",
]
lsp = [
    "multilspy>=0.0.15",
]
# SecretsSkill's keystore backend (macOS Keychain, Linux Secret Service,
# Windows Credential Manager). An EXTRA rather than a hard dependency, on
# purpose: agents are served from containers and headless hosts by default,
# where `keyring` imports fine and then resolves to the `fail` backend, so
# every install would carry a DBus-adjacent dependency to serve the minority
# that can use it. It is declared here either way, because a documented import
# that is not a declared dependency is the F-040 bug. Without it the skill
# still works and stores secrets in an owner-only file, loudly.
keyring = [
    "keyring>=25.0.0",
]
# `uvx` for the many MCP servers published to PyPI (`command: uvx`), for a
# machine without uv (2026-09-29). An extra, not a dependency: it is a 17 MB
# binary per platform, and most people who run uvx servers have uv already.
# The MCP skill looks for `uvx` on PATH, then beside this Python, then in this
# package (`skills/local/mcp/skill.py` `_uv_fallback`), so an unactivated
# virtual environment still finds it.
uv = [
    "uv>=0.5.0",
]
# The docs have long advertised `pip install webagents[robutler]`; the extra
# never existed, and pip downgraded that to a warning with exit 0. The
# platform API client is part of the SDK (`agents/skills/robutler/api/`, moved
# in from the `robutler` package on 2026-09-25), so the extra installs nothing
# more. It stays, empty, so the advertised command still works: an empty extra
# is still declared in the wheel's metadata.
robutler = []
all = [
    "webagents[llm,embeddings,scraping,tui,lsp,robutler,keyring]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
    "mypy>=1.0.0",
]
examples = [
    "openai-agents>=0.0.16",
]

[project.scripts]
# The TypeScript package's commands, name for name. The daemon is
# `webagents daemon` in both; the Python-only `webagentsd` alias for it was
# dropped on 2026-09-25.
webagents = "webagents.__main__:main"
robutler = "webagents.robutler_entry:main"

# The vendored sandbox engine (webagents/sandbox/sandbox_engine/, written by
# scripts/sandbox_engine_vendor.py) holds srt's `dist/` and commander's `lib/`,
# which this folder's .gitignore drops as build output; hatchling reads that
# file, so without this the wheel shipped an engine missing its own code.
# `artifacts` includes them in the sdist and the wheel alike.
[tool.hatch.build]
artifacts = ["webagents/sandbox/sandbox_engine/**"]

# Pytest configuration.
#
# NOTE: `pytest.ini` sits next to this file and WINS — pytest's discovery stops
# at the first pytest.ini it finds, so this table is only a mirror for tools
# that read pyproject. Keep the two in agreement. (The ini used to carry the
# setup.cfg-only header `[tool:pytest]`, which pytest parses to nothing while
# the file's existence still shadowed this table — so no configuration at all
# was in force and every `async def` test errored. Fixed in place.)
#
# Keys deliberately absent from BOTH files:
#   --co -q        (collect-only poisoning every local run)
#   --cov* keys    (pytest-cov is not a declared dependency)
#   timeout = 300  (pytest-timeout is not a declared dependency)
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers -ra"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "mcp: marks tests as MCP-related",
    "performance: marks tests as performance tests",
    "auth: marks tests as authentication tests",
    "skill: marks tests as skill tests",
    "agent: marks tests as agent tests",
    "server: marks tests as server tests",
    "docs: marks tests that validate documentation code snippets",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    "ignore:Support for class-based.*:DeprecationWarning",
    "ignore:The event_loop fixture.*:DeprecationWarning",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

# Honest floor. The aspirational `select = ["E","F","I"]` (in the deprecated
# top-level spelling, which current ruff ignores) has never been green on
# this tree — `ruff check .` reports ~5,200 findings under it, so the CI
# lint step could not have been enforcing anything. This selection is the
# set that IS clean today: syntax errors and the correctness-bug F-rules.
# Ratchet upward deliberately; never widen without making the tree pass.
[tool.ruff.lint]
select = ["E9", "F63", "F7"]
# F82 (F821 undefined-name) is the rule family that statically catches the
# F-040 failure mode, and it is deliberately NOT in the floor yet: `ruff check
# --select F82 .` reports 20 findings today, all of them QUOTED forward-ref
# annotations whose name is imported nowhere (`"BaseAgent"`, `"httpx"`,
# `"WebAgentsServer"`, `"Context"`, `"TestRunnerSkill"`) plus two test
# fixtures. They are harmless at runtime but DO break
# `typing.get_type_hints()` resolution on those functions. Add TYPE_CHECKING
# imports for each, confirm `--select F82` is clean, then add "F82" here.
# scripts/lint_annotations.py covers a narrower slice of the same problem in
# the meantime.

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[project.urls]
Homepage = "https://robutler.ai/docs/webagents"
Repository = "https://github.com/robutlerai/webagents"
Issues = "https://github.com/robutlerai/webagents/issues"
Documentation = "https://robutler.ai/docs/webagents"